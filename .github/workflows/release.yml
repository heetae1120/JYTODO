name: Build Windows download

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  database:
    name: Cloud sync and database isolation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm ci --no-audit --no-fund
      - name: Test authentication, sync and storage
        run: npm test
      - name: Test real PostgreSQL row-level security
        run: npm run test:rls
      - name: Verify configured hosted backend
        run: npm run test:cloud
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Build interface
        run: npm run build
      - name: Test two-computer account workflow
        run: npm run test:accounts:ui
      - name: Test colors, optional times, reminders and scrolling
        run: npm run test:ui
  windows:
    needs: database
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Prepare Electron
        run: npm run setup:electron
      - name: Test API, storage and scheduling
        run: npm test
      - name: Build interface
        run: npm run build
      - name: Test native Windows application
        run: npm run test:desktop
      - name: Build Windows executable and ZIP
        run: npm run package:win
      - name: Write download checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem release/JYTODO-Portable-*-x64.exe, release/JYTODO-*-Windows-x64.zip
          if ($files.Count -ne 2) { throw 'Expected one executable and one ZIP.' }
          $lines = $files | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $lines | Set-Content release/SHA256SUMS -Encoding ascii
      - name: Retain downloads
        uses: actions/upload-artifact@v4
        with:
          name: JYTODO-Windows-x64
          path: |
            release/JYTODO-Portable-*-x64.exe
            release/JYTODO-*-Windows-x64.zip
            release/SHA256SUMS
          if-no-files-found: error
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: pwsh
        run: |
          @'
          파스텔 핑크 테마와 새 캐릭터 아이콘을 적용한 Windows 64비트용 JYTODO입니다.

          - 분류를 제거하고 마우스로 고르는 RGB 컬러칩으로 중요도를 표시합니다.
          - 시간 지정 안 함을 지원합니다. 날짜만 있는 할 일에는 알림이 없습니다.
          - 팝업 · 알람은 기본 OFF이며, ON일 때만 원하는 알림 날짜와 시간을 설정합니다.
          - 오늘의 한 걸음·함께 쓰면 더 편해요·다음 일정을 제거했습니다.
          - 페이지와 설정 창이 화면보다 길면 스크롤할 수 있습니다.

          JYTODO-Portable-*.exe는 설치 없이 실행하는 단일 파일입니다. ZIP은 전체 압축을 풀고 JYTODO.exe를 실행하세요. 업데이트 전에 기존 프로그램을 트레이에서 완전히 종료하세요. 계정·할 일·PC 연동 설정은 보존됩니다. 모든 PC를 같은 버전으로 업데이트하면 새 컬러와 시간 표시를 동일하게 볼 수 있습니다.

          기본 동기화 서버가 포함되어 있습니다. 이메일 인증 후 같은 계정으로 로그인하세요. 예약 알림은 로그인 상태에서 프로그램이 실행 중일 때 동작합니다. 창의 X는 트레이로 숨깁니다. Windows 알림 소리는 OS 알림·볼륨·방해 금지 설정에 영향을 받습니다. Slack·Google은 PC별 연결이 필요합니다. 코드 서명 전 개발 버전입니다.
          '@ | Set-Content release/notes.md -Encoding utf8
          gh release view "$env:GITHUB_REF_NAME" --json tagName --jq .tagName
          if ($LASTEXITCODE -ne 0) {
            gh release create "$env:GITHUB_REF_NAME" --verify-tag --draft --title "JYTODO $env:GITHUB_REF_NAME · Windows" --notes-file release/notes.md
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed.' }
          }
          $assets = @(Get-ChildItem release/JYTODO-Portable-*-x64.exe, release/JYTODO-*-Windows-x64.zip | ForEach-Object { $_.FullName })
          $assets += (Resolve-Path release/SHA256SUMS).Path
          gh release upload "$env:GITHUB_REF_NAME" @assets --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release asset upload failed.' }
          gh release edit "$env:GITHUB_REF_NAME" --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
