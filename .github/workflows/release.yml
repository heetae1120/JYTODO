name: Build Windows download

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  database:
    name: Cloud sync and database isolation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm ci --no-audit --no-fund
      - name: Test authentication, sync and storage
        run: npm test
      - name: Test real PostgreSQL row-level security
        run: npm run test:rls
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Build interface
        run: npm run build
      - name: Test two-computer account workflow
        run: npm run test:accounts:ui
  windows:
    needs: database
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Prepare Electron
        run: npm run setup:electron
      - name: Test API, storage and scheduling
        run: npm test
      - name: Build interface
        run: npm run build
      - name: Test native Windows application
        run: npm run test:desktop
      - name: Build Windows executable and ZIP
        run: npm run package:win
      - name: Write download checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem release/JYTODO-Portable-*-x64.exe, release/JYTODO-*-Windows-x64.zip
          if ($files.Count -ne 2) { throw 'Expected one executable and one ZIP.' }
          $lines = $files | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $lines | Set-Content release/SHA256SUMS -Encoding ascii
      - name: Retain downloads
        uses: actions/upload-artifact@v4
        with:
          name: JYTODO-Windows-x64
          path: |
            release/JYTODO-Portable-*-x64.exe
            release/JYTODO-*-Windows-x64.zip
            release/SHA256SUMS
          if-no-files-found: error
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: pwsh
        run: |
          @'
          Windows 64비트용 JYTODO 계정 동기화 버전입니다.

          - JYTODO-Portable-*.exe: 설치 없이 실행하는 단일 파일
          - JYTODO-*-Windows-x64.zip: 전체 압축을 풀고 JYTODO.exe 실행
          - SHA256SUMS: 다운로드 파일 무결성 확인용

          프로그램을 완전히 종료한 뒤 다시 실행할 때마다 이메일·비밀번호로 로그인합니다. 같은 Supabase 프로젝트와 계정을 사용하면 다른 PC에서도 할 일을 불러옵니다. 첫 사용에는 Supabase 프로젝트를 생성하고 README의 SQL 설정과 공개 연결 정보를 등록해야 합니다. 실제 프로젝트와 계정은 배포 파일에 포함되어 있지 않습니다.

          오프라인 변경은 PC에 보관했다가 다시 연결되면 보내고, 두 PC에서 수정한 항목의 충돌은 직접 선택합니다. 기존 PC 내역은 계정 관리에서 명시적으로 가져올 수 있습니다. 업데이트 전에는 기존 프로그램을 트레이에서 완전히 종료해 주세요.

          창의 X 버튼은 트레이로 숨깁니다. 로그인 상태에서 예약 시간이 되면 프로그램 창을 다시 띄웁니다. 로그아웃·완전 종료·PC 종료 중에는 알림이 동작하지 않습니다.

          코드 서명 전 버전입니다. Slack·Google 캘린더는 사용자 계정 설정이 필요합니다. Windows OS 토스트·자동 실행 설정은 PC별 확인이 필요합니다. 자세한 사용법은 저장소 README를 확인하세요.
          '@ | Set-Content release/notes.md -Encoding utf8
          gh release view "$env:GITHUB_REF_NAME" --json tagName --jq .tagName
          if ($LASTEXITCODE -ne 0) {
            gh release create "$env:GITHUB_REF_NAME" --verify-tag --draft --title "JYTODO $env:GITHUB_REF_NAME · Windows" --notes-file release/notes.md
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed.' }
          }
          $assets = @(Get-ChildItem release/JYTODO-Portable-*-x64.exe, release/JYTODO-*-Windows-x64.zip | ForEach-Object { $_.FullName })
          $assets += (Resolve-Path release/SHA256SUMS).Path
          gh release upload "$env:GITHUB_REF_NAME" @assets --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release asset upload failed.' }
          gh release edit "$env:GITHUB_REF_NAME" --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
